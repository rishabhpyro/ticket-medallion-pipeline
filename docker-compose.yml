version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: medallion-pg
    environment:
      POSTGRES_USER: medallion
      POSTGRES_PASSWORD: medallion
      POSTGRES_DB: medallion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medallion"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
